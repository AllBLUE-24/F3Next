services:
  # 1. Temporal's Internal Brain (Do NOT use this for your app data)
  temporal-db:
    image: postgres:15-alpine
    container_name: f3_temporal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal_admin
      POSTGRES_PASSWORD: temporal_password # Change this in production
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data

  # 2. Temporal Server
  temporal:
    image: temporalio/auto-setup:latest
    container_name: f3_temporal
    depends_on:
      - temporal-db
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal_admin
      POSTGRES_PWD: temporal_password
      POSTGRES_SEEDS: temporal-db
      # Temporal will auto-create the necessary schemas in the temporal-db

      # 3. Temporal UI
  temporal-ui:
    image: temporalio/ui:latest
    container_name: f3_temporal_ui
    depends_on:
      - temporal
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CSRF_COOKIE_INSECURE: true

  redis:
    image: redis:7-alpine
    container_name: f3_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # 4. Workers
  discovery_worker:
    build:
      context: .
      dockerfile: containers/discovery/Dockerfile
    container_name: f3_discovery_worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST=temporal:7233

  erpnext_infra_worker:
    build:
      context: .
      dockerfile: containers/erpnext/Dockerfile
    container_name: f3_erpnext_worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST=temporal:7233
    volumes:
      - ./secrets:/app/secrets
    # Explicit DNS — same fix as cvs_worker. This worker SSHes into customer ERPNext instances.
    dns:
      - 8.8.8.8
      - 1.1.1.1

  health_check_worker:
    build:
      context: .
      dockerfile: containers/health_check/Dockerfile
    container_name: f3_health_check_worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST=temporal:7233

  implementation_worker:
    build:
      context: .
      dockerfile: containers/implementation/Dockerfile
    container_name: f3_implementation_worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - temporal
      - redis
    environment:
      - TEMPORAL_HOST=temporal:7233
      - REDIS_URL=redis://redis:6379/0

  os_worker:
    build:
      context: .
      dockerfile: containers/os/Dockerfile
    container_name: f3_os_worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - temporal
      - redis
    environment:
      - TEMPORAL_HOST=temporal:7233
      - REDIS_URL=redis://redis:6379/0

  cvs_worker:
    build:
      context: .
      dockerfile: containers/context_versioning/Dockerfile
    container_name: f3_cvs_worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - temporal
      - redis
    environment:
      - TEMPORAL_HOST=temporal:7233
      - REDIS_URL=redis://redis:6379/0
    # Explicit DNS — fixes systemd-resolved loopback (127.0.0.53) issue on DO/Ubuntu hosts.
    # This container must reach external ERPNext instances (e.g. f3.f3next.in) to build CVS snapshots.
    dns:
      - 8.8.8.8
      - 1.1.1.1

  cvs_poller:
    build:
      context: .
      dockerfile: containers/context_versioning/Dockerfile
    container_name: f3_cvs_poller
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - temporal
    command: ["python", "-m", "containers.context_versioning.poller_worker"]
    environment:
      - TEMPORAL_HOST=temporal:7233
    dns:
      - 8.8.8.8
      - 1.1.1.1

  cvs_recovery:
    build:
      context: .
      dockerfile: containers/context_versioning/Dockerfile
    container_name: f3_cvs_recovery
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - temporal
    command: ["python", "-m", "containers.context_versioning.recovery_worker"]
    environment:
      - TEMPORAL_HOST=temporal:7233
    dns:
      - 8.8.8.8
      - 1.1.1.1

  knowledge_base_seeder:
    build:
      context: .
      dockerfile: containers/knowledge_base/Dockerfile
    container_name: f3_kb_seeder
    env_file:
      - .env
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST=temporal:7233
    # No restart policy here so it only runs once per deployment to seed the DB

    # 5. Application Servers (Backend API & Frontend Web)
  backend_api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: f3_backend_api
    env_file:
      - .env
    # Port NOT exposed publicly — Caddy proxies /api/* to this container
    restart: unless-stopped
    depends_on:
      - temporal
      - redis
    environment:
      - TEMPORAL_HOST=temporal:7233
      - REDIS_URL=redis://redis:6379/0

  frontend_web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: f3_frontend_web
    env_file:
      - .env
    # Port NOT exposed publicly — Caddy proxies to this container
    restart: unless-stopped
    depends_on:
      - backend_api

  # 6. Reverse Proxy (single public entrypoint)
  caddy:
    image: caddy:2-alpine
    container_name: f3_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend_web
      - backend_api

  prometheus:
    image: prom/prometheus:latest
    container_name: f3_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts-f3next.yml:/etc/prometheus/alerts-f3next.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend_api

  grafana:
    image: grafana/grafana:latest
    container_name: f3_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  temporal_postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  