services:
  # 1. Temporal's Internal Brain (Do NOT use this for your app data)
  temporal-db:
    image: postgres:15-alpine
    container_name: f3_temporal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal_admin
      POSTGRES_PASSWORD: temporal_password # Change this in production
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data

  # 2. Temporal Server
  temporal:
    image: temporalio/auto-setup:latest
    container_name: f3_temporal
    depends_on:
      - temporal-db
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal_admin
      POSTGRES_PWD: temporal_password
      POSTGRES_SEEDS: temporal-db
      # Temporal will auto-create the necessary schemas in the temporal-db

  # 3. Temporal UI
  temporal-ui:
    image: temporalio/ui:latest
    container_name: f3_temporal_ui
    depends_on:
      - temporal
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CSRF_COOKIE_INSECURE: true

  # 4. Workers
  discovery_worker:
    build:
      context: .
      dockerfile: containers/discovery/Dockerfile
    container_name: f3_discovery_worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST_URL=temporal:7233

  erpnext_infra_worker:
    build:
      context: .
      dockerfile: containers/erpnext/Dockerfile
    container_name: f3_erpnext_worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST_URL=temporal:7233

  health_check_worker:
    build:
      context: .
      dockerfile: containers/health_check/Dockerfile
    container_name: f3_health_check_worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST_URL=temporal:7233

  implementation_worker:
    build:
      context: .
      dockerfile: containers/implementation/Dockerfile
    container_name: f3_implementation_worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST_URL=temporal:7233

  os_worker:
    build:
      context: .
      dockerfile: containers/os/Dockerfile
    container_name: f3_os_worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST_URL=temporal:7233

  knowledge_base_seeder:
    build:
      context: .
      dockerfile: containers/knowledge_base/Dockerfile
    container_name: f3_kb_seeder
    env_file:
      - .env
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST_URL=temporal:7233
    # No restart policy here so it only runs once per deployment to seed the DB

  # 5. Application Servers (Backend API & Frontend Web)
  backend_api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: f3_backend_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - temporal

  frontend_web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: f3_frontend_web
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend_api

volumes:
  temporal_postgres_data:
