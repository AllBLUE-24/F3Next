services:
  # 1. Temporal's Internal Brain (Do NOT use this for your app data)
  temporal-db:
    image: postgres:15-alpine
    container_name: f3_temporal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal_admin
      POSTGRES_PASSWORD: temporal_password # Change this in production
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data

  # 2. Temporal Server
  temporal:
    image: temporalio/auto-setup:latest
    container_name: f3_temporal
    depends_on:
      - temporal-db
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal_admin
      POSTGRES_PWD: temporal_password
      POSTGRES_SEEDS: temporal-db
      # Temporal will auto-create the necessary schemas in the temporal-db

  # 3. Temporal UI
  temporal-ui:
    image: temporalio/ui:latest
    container_name: f3_temporal_ui
    depends_on:
      - temporal
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233

  # 4. Your Python Agents
  discovery-agent:
    build: 
      context: .
      dockerfile: ./containers/discovery/Dockerfile
    container_name: f3_discovery_agent
    restart: always
    env_file: .env # Reads all variables natively
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST_URL=temporal:7233

  health-check-agent:
    build: 
      context: .
      dockerfile: ./containers/health_check/Dockerfile
    container_name: f3_health_check_agent
    restart: always
    env_file: .env
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST_URL=temporal:7233

  os-agent:
    build: 
      context: .
      dockerfile: ./containers/os/Dockerfile
    container_name: f3_os_agent
    restart: always
    env_file: .env
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST_URL=temporal:7233

  implementation-agent:
    build: 
      context: .
      dockerfile: ./containers/implementation/Dockerfile
    container_name: f3_implementation_agent
    restart: always
    env_file: .env
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST_URL=temporal:7233

  erpnext-agent:
    build: 
      context: .
      dockerfile: ./containers/erpnext/Dockerfile
    container_name: f3_erpnext_agent
    restart: always
    env_file: .env
    depends_on:
      - temporal
    environment:
      - TEMPORAL_HOST_URL=temporal:7233

volumes:
  temporal_postgres_data: