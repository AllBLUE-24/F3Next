#version: '3.8'  --> docker said to remove it in cl but i kept it commented out 

services:
  # --- Backend Service ---
  backend:
    build:
      # 1. Context: Go up one level to Root (C:\dev\F3Next)
      context: ../
      # 2. Dockerfile: Relative to Context (C:\dev\F3Next\backend\Dockerfile)
      dockerfile: backend/Dockerfile
    container_name: f3next-backend
    ports:
      - "8000:8000"
    # 3. Load Environment Variables from Root
    env_file:
      - ../.env
    environment:
      # Explicit overrides if needed, otherwise it pulls from .env
      - DATABASE_URL=postgresql+asyncpg://postgres:password@host.docker.internal:5432/f3next_db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Frontend Service ---
  frontend:
    build:
      # 1. Context: Go up one level to Root (C:\dev\F3Next)
      context: ../frontend
      dockerfile: Dockerfile
    container_name: f3next-frontend
    ports:
      - "3000:3000"
    # 3. Load Environment Variables from Root
    env_file:
      - ../frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000    # NEXT_PUBLIC_API_URL=https://7shirz4ba8.ap-south-1.awsapprunner.com 

    depends_on:
      - backend
  db:
    image: postgres:15-alpine
    container_name: f3_postgres
    restart: unless-stopped # A slight improvement over 'always'
    environment:
      # Use ${VAR:-default_value} syntax for flexibility and security
      POSTGRES_USER: ${POSTGRES_USER:-f3admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f3password}
      POSTGRES_DB: ${POSTGRES_DB:-f3next}
    ports:
      - "5432:5432"
    volumes:
      # Map internal path to the named volume 'postgres_data'
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Ensures the DB software is ready *before* other services try to connect
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f3admin}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - f3_net
# --- Auxiliary Services (Optional, but recommended) ---
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080" # Access via http://localhost:8080
    # Make sure adminer can see the 'db' service on the network
    networks:
      - f3_net

volumes:
  postgres_data: # Declare the volume for persistence

networks:
  f3_net:
    driver: bridge
