#version: '3.8'  --> docker said to remove it in cl but i kept it commented out 

services:
  # --- Backend Service ---
  backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: f3next-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TEMPORAL_URL=temporal:7233
      - PYTHONPATH=/app:/app/shared # Ensures shared/ and agents/ are importable
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - f3_net

    volumes:
    - ../backend:/app/backend
    - ../shared:/app/shared

  # --- Frontend Service ---
  frontend:
    build:
      # 1. Context: Go up one level to Root (C:\dev\F3Next)
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # This tells Docker to take these from your local environment/.env and 
        # pass them into the actual build process
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
        
    container_name: f3next-frontend
    ports:
      - "3000:3000"
    # 3. Load Environment Variables from Root
    env_file:
      - ../frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000} 

    depends_on:
      - backend


  temporal:
    container_name: f3_temporal
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    env_file:
      - ../.env
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=db
      #### need to get removed - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    depends_on:
      db:
        condition: service_healthy
    networks:
      - f3_net
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: temporalio/ui:latest
    container_name: f3_temporal_ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    networks:
      - f3_net    

  # --- Health Check Agent (Temporal Worker) ---
  health-check-worker:
    build:
      context: ../
      dockerfile: containers/health_check/Dockerfile
    container_name: f3_health_check_worker
    env_file:
      - ../.env
    environment:
      - TEMPORAL_URL=temporal:7233
      - PYTHONPATH=/app:/app/shared
    depends_on:
      - temporal
    networks:
      - f3_net
    volumes:
    - ../containers/health_check:/app/containers/health_check
    - ../shared:/app/shared    

  db:
    image: postgres:15-alpine
    container_name: f3_postgres
    restart: unless-stopped
    
    env_file:
      - ../.env
       # A slight improvement over 'always'
    environment:
      # Use ${VAR:-default_value} syntax for flexibility and security
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # Map internal path to the named volume 'postgres_data'
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Ensures the DB software is ready *before* other services try to connect
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - f3_net
# --- Auxiliary Services (Optional, but recommended) ---
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080" # Access via http://localhost:8080
    # Make sure adminer can see the 'db' service on the network
    networks:
      - f3_net

volumes:
  postgres_data: # Declare the volume for persistence

networks:
  f3_net:
    driver: bridge
