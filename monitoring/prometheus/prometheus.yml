global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts-f3next.yml

scrape_configs:
  - job_name: f3next_backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend_api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]